services:
  antigravity-proxy:
    build: .
    image: antigravity-proxy:korvo-video
    container_name: antigravity-proxy
    restart: unless-stopped
    working_dir: /app
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - TZ=Asia/Taipei
      # 保留原廠的關鍵環境變數
      - ACCOUNTS_FILE=/app/data/antigravity-accounts.json
      - BASE_URL=http://127.0.0.1:3000
      - KORVO_CONTROL_PORT=${KORVO_CONTROL_PORT:-3100}
      - KORVO_MEDIA_BASE_URL=${KORVO_MEDIA_BASE_URL:-http://192.168.50.75:3001}
      - KORVO_ALLOWED_DEVICE_ID=${KORVO_ALLOWED_DEVICE_ID:-esp32s31-korvo-1}
      - KORVO_MEDIA_API_TOKEN=${KORVO_MEDIA_API_TOKEN:-}
    ports:
      # 避開 3000 port 衝突
      - "3001:3000"
      - "3101:${KORVO_CONTROL_PORT:-3100}"
    volumes:
      # 1. 掛載本地 Source Code，修改後直接生效
      - .:/app
      # 2. 保留帳號認證資料 (最關鍵)，帶有 :z SELinux 權限標記
      - ./data:/app/data:z
      # 3. 防止本地 node_modules 與容器內套件發生架構衝突
      - /app/node_modules
      # 4. Bun 套件快取
      - bun-cache:/root/.bun
    # Runtime dependencies are installed into the image at build time. Running
    # bun install again against this anonymous volume can race on its links.
    command: bun run start

volumes:
  bun-cache:
